kind = "mobile"
previewPath = "/mobile/"
title = "Token Tracker Mobile"
version = "1.0.0"
id = "artifacts/token-tracker-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20501

[services.development]
run = "pnpm --filter @workspace/token-tracker-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/token-tracker-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/token-tracker-mobile", "run", "serve" ]

[services.env]
PORT = "20501"
BASE_PATH = "/mobile/"
